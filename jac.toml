[project]
name = "JacHacks"
version = "1.0.0"
description = "A minimal GitHub repository security scan demo built with Jac."
entry-point = "main.jac"
kind = "web-app"
jac-version = "==0.34.7"

[dependencies]
accelerate = ">=1.1,<2"
datasets = ">=2.20,<4"
numpy = ">=1.26,<3"
pandas = ">=2,<3"
safetensors = ">=0.4,<1"
scikit-learn = ">=1.4,<2"
torch = ">=2.2,<3"
transformers = ">=4.46,<5"
[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "4.7.0"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"



[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

[client]

[client.app_meta_data]
title = "Verify Code"
description = "Scan public GitHub repositories with a Jac CodeBERT security model."
theme_color = "#f7f7f7"
